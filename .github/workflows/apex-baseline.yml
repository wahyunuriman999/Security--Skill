name: APEX Baseline Guardrails

on:
  push:
    branches:
      - main
      - "apex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apex-guardrails-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-validation:
    name: Offline repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Validate skill corpus and routing manifest
        run: python scripts/validate.py

      - name: Compile all Python sources
        run: python -m compileall -q scripts security tools apex

      - name: Run deterministic APEX unit tests
        run: python -m unittest discover -s apex/tests -v

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find security tools scripts -type f -name '*.js' -print0)

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            bash -n "$file"
          done < <(find security tools scripts -type f -name '*.sh' -print0)

      - name: Confirm no network-oriented tests are run
        run: |
          echo "This workflow performs static/offline checks only."
          echo "It does not execute target-facing scanners, fuzzers, callbacks, or active recon."
