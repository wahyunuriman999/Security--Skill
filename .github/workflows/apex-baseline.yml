name: APEX Baseline Guardrails

on:
  push:
    branches:
      - main
      - "apex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apex-guardrails-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-validation:
    name: Offline repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: false

      - name: Validate skill corpus and routing manifest
        run: python scripts/validate.py

      - name: Compile all Python sources
        run: python -m compileall -q scripts security tools

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find security tools scripts -type f -name '*.js' -print0)

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            bash -n "$file"
          done < <(find security tools scripts -type f -name '*.sh' -print0)

      - name: Confirm no network-oriented tests are run
        run: |
          echo "This workflow performs static/offline checks only."
          echo "It does not execute target-facing scanners, fuzzers, callbacks, or active recon."
